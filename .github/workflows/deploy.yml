name: Deploy to arhimeds.ru

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/deploy-arhimeds-ru-w6u3d4

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure server (nginx + certbot)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            DOMAIN="arhimeds.ru"
            WWW_DOMAIN="www.arhimeds.ru"
            REMOTE_DIR="/var/www/arhimeds.ru"

            apt-get update -y
            apt-get install -y nginx certbot python3-certbot-nginx rsync

            mkdir -p "$REMOTE_DIR"

            cat > /etc/nginx/sites-available/$DOMAIN <<NGINX_EOF
            server {
                listen 80;
                listen [::]:80;
                server_name $DOMAIN $WWW_DOMAIN;

                root $REMOTE_DIR;
                index index.html;

                gzip on;
                gzip_types text/css application/javascript application/json image/svg+xml;

                location / {
                    try_files \$uri \$uri/ /index.html;
                }

                location /assets/ {
                    expires 1y;
                    add_header Cache-Control "public, immutable";
                }
            }
            NGINX_EOF

            ln -sf /etc/nginx/sites-available/$DOMAIN /etc/nginx/sites-enabled/$DOMAIN
            rm -f /etc/nginx/sites-enabled/default
            nginx -t
            systemctl reload nginx

      - name: Upload build (dist/) via rsync
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: -avz --delete
          path: dist/
          remote_path: /var/www/arhimeds.ru/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Issue/renew SSL certificate
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            certbot --nginx -d arhimeds.ru -d www.arhimeds.ru --non-interactive --agree-tos -m admin@arhimeds.ru --redirect || true
